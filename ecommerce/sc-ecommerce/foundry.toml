[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.optimizer_details]
peephole = true
inliner = true
jumpdestRemover = true
orderLiterals = true
deduplicate = true
cse = true
constantOptimizer = true
yul = true
yulDetails = {
    stackAllocation = true
}

[rpc_endpoints]
anvil = "http://localhost:8545"

[etherscan]
localhost = { url = "http://localhost:8545" }
